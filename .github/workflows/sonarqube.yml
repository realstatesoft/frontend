name: Análisis de Calidad - Frontend Vite

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
    types: [opened, synchronize, reopened]

jobs:
  sonarqube:
    name: Build and Analyze
    runs-on: ubuntu-latest
    if: ${{ secrets.SONAR_TOKEN != '' }}
    
    # Seguridad: Principio de menor privilegio
    permissions:
      contents: read
    
    steps:
      - name: Descargar el código fuente
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  
          persist-credentials: false

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@9db616954e7d4d4453531633519128f73e7d58a5 # v6.0.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}